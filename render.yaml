# Render Blueprint: https://render.com/docs/infrastructure-as-code
# Set `name` to match your existing Web Service in the dashboard (so updates apply to it,
# not a second service). If you only use the dashboard, copy buildCommand/startCommand there.
services:
  - type: web
    name: one-way-decision # <-- change to your service name on Render
    runtime: python
    # Explicit multipart reinstall: ensures the wheel is present even when -r skips it.
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install --upgrade --force-reinstall "python-multipart>=0.0.12"
    # Bind 0.0.0.0 (not 127.0.0.1) or Render reports "No open ports detected".
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
